<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia Sesion</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg p-3 mb-5 bg-body rounded" style="width: 100%; max-width: 400px;">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Registro</h2>
                <form id="registroForm">
                    <!-- Nombre -->
                    <div class="mb-3">
                        <label for="name" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="name" placeholder="Ingrese su nombre" required>
                    </div>
                    <!-- Apellido -->
                    <div class="mb-3">
                        <label for="lastname" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="lastname" placeholder="Ingrese su apellido" required>
                    </div>
                    <!-- Correo electrónico -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" placeholder="Ingrese su correo" required>
                    </div>
                    <!-- Teléfono -->
                    <div class="mb-3">
                        <label for="cellphone" class="form-label">Teléfono</label>
                        <input type="tel" class="form-control" id="cellphone" placeholder="Ingrese su teléfono" required>
                    </div>
                    <!-- Botón de envío -->
                    <button type="submit" class="btn btn-primary w-100">Registrarse</button>
                </form>
                <!-- Mensaje de error o éxito -->
                <div id="message" class="mt-3 text-center"></div>
                
                <div class="mt-3 text-center">
                    <a href="#" class="text-decoration-none">¿Ya tienes una cuenta? Inicia sesión</a>
                </div>
                <!-- Mensaje de éxito/error -->
                <div id="message" class="mt-3 text-center"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script src="js/login.js"></script>
    </body>
</html>
